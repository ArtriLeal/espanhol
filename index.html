<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Espanhol</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f8b7d">
<link rel="icon" href="icon.svg">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d2b2a; --muted:#6b7775; --line:#e3e0d8;
  --pri:#0f8b7d; --pri-d:#0a6b60; --ok:#2f9e44; --ok-bg:#e6f6ea; --bad:#d9480f; --bad-bg:#fdeee6;
  --gold:#f2a516; --tile:#fff; --tile-b:#d7d3c9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px;font-weight:700}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:15px}
h1{font-size:22px;margin:4px 16px 2px}
.sub{color:var(--muted);margin:0 16px 12px;font-size:15px}
.unit{margin:10px 16px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.unit.locked{opacity:.55}
.unit h2{margin:0 0 2px;font-size:18px}
.unit p{margin:0 0 10px;color:var(--muted);font-size:14px}
.lv{display:flex;gap:8px;flex-wrap:wrap}
.lvb{flex:1;min-width:92px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:14px;padding:9px 6px;font-weight:700;font-size:14px;text-align:center}
.lvb.done{border-color:var(--ok);color:var(--ok)}
.lvb.next{border-color:var(--pri);background:var(--pri);color:#fff}
.lvb:disabled{cursor:default}
.rev{margin:0 16px 12px;width:calc(100% - 32px);border:2px solid var(--gold);border-bottom-width:4px;background:#fff8e6;border-radius:16px;padding:12px;font-weight:700;text-align:left}
.rev small{display:block;font-weight:400;color:var(--muted)}
/* lição */
.lhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.hearts{font-weight:700;color:var(--bad)}
.body{flex:1;padding:6px 18px 18px;display:flex;flex-direction:column}
.kind{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pri);margin:4px 0 6px}
.q{font-size:21px;font-weight:700;margin:0 0 14px}
.prompt{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:20px}
.spk{flex:none;width:52px;height:52px;border-radius:14px;border:0;background:var(--pri);color:#fff;font-size:22px;border-bottom:4px solid var(--pri-d)}
.spk.small{width:40px;height:40px;font-size:17px;border-radius:12px}
.spk.slow{background:#fff;color:var(--pri);border:2px solid var(--pri);border-bottom-width:4px}
.bigspk{display:flex;gap:12px;justify-content:center;margin:18px 0 22px}
.bigspk .spk{width:84px;height:84px;font-size:34px;border-radius:22px}
.bigspk .spk.slow{width:64px;height:64px;font-size:22px;align-self:flex-end}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-size:18px}
.opt.sel{border-color:var(--pri);background:#e7f5f3}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;font-size:16px;padding:12px 6px}
.pairs .opt.gone{visibility:hidden}
.answer{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tl{background:var(--tile);border:2px solid var(--tile-b);border-bottom-width:4px;border-radius:12px;padding:8px 13px;font-size:18px}
.tl.used{visibility:hidden}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:19px;resize:none;background:#fff}
.dlg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.dlg div{display:flex;gap:8px;align-items:center;padding:4px 0}
.dlg b{color:var(--pri);min-width:22px}
.learn{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;margin-top:6px}
.learn .es{font-size:30px;font-weight:800;margin:10px 0 2px}
.learn .pt{font-size:19px;color:var(--muted)}
.learn .pr{margin-top:10px;font-size:15px;color:var(--ink);background:#f1efe9;border-radius:10px;padding:6px 10px;display:inline-block}
.tip{text-align:left;margin-top:14px;background:#fff8e6;border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:15px}
.intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;font-size:17px}
.intro h3{margin:0 0 8px}
.intro ul{padding-left:20px;margin:8px 0}
.foot{position:sticky;bottom:0;padding:14px 18px 18px;background:var(--bg);border-top:2px solid transparent}
.foot.ok{background:var(--ok-bg);border-top-color:var(--ok)}
.foot.bad{background:var(--bad-bg);border-top-color:var(--bad)}
.fb{margin-bottom:10px;font-size:16px}
.fb strong{font-size:19px;display:block;margin-bottom:2px}
.ok .fb strong{color:var(--ok)} .bad .fb strong{color:var(--bad)}
.why{margin-top:6px;font-size:15px;color:var(--ink)}
.go{width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--pri);border-bottom:4px solid var(--pri-d)}
.go:disabled{background:#cfcbc1;border-bottom-color:#b9b5ab;color:#fff}
.ok .go{background:var(--ok);border-bottom-color:#237a34}
.bad .go{background:var(--bad);border-bottom-color:#a83a0c}
.row{display:flex;gap:10px;margin-top:10px}
.row .go{flex:1}
.ghost{background:#fff!important;color:var(--muted)!important;border:2px solid var(--line)!important;border-bottom-width:4px!important}
.mic{width:100%;padding:18px;border-radius:18px;border:2px solid var(--pri);border-bottom-width:5px;background:#fff;color:var(--pri);font-weight:800;font-size:18px}
.mic.on{background:var(--pri);color:#fff}
.heard{margin-top:12px;color:var(--muted);text-align:center;min-height:24px}
.end{text-align:center;padding:30px 20px}
.end .big{font-size:56px}
.stats{display:flex;gap:10px;justify-content:center;margin:18px 0}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800}
.stats small{display:block;font-weight:400;color:var(--muted)}
.note{margin:6px 16px 24px;color:var(--muted);font-size:13px;text-align:center}
/* movimento leve (sem pesar) */
@keyframes inR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
.body{animation:inR .2s ease-out}
.foot.ok,.foot.bad{animation:up .18s ease-out}
.shake{animation:shake .32s}
.hearts.hit{display:inline-block;animation:beat .4s}
.go,.opt,.tl,.lvb,.spk,.mic,.rev{transition:transform .06s}
.go:active:not(:disabled),.opt:active,.tl:active,.lvb:active:not(:disabled),.spk:active,.mic:active,.rev:active{transform:translateY(2px)}
.opt.right{animation:pop .25s}
.end .big{animation:pop .5s}
.stats div{animation:pop .4s backwards}.stats div:nth-child(2){animation-delay:.12s}.stats div:nth-child(3){animation-delay:.24s}
.combo{display:inline-block;margin-left:6px;font-size:15px;color:var(--gold);animation:pop .3s}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:15px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<script src="audio.js"></script>
<script>
/* ===================== CONTEÚDO =====================
   Cada unidade: intro (o que tu vai aprender), learn (cartões: es, pt, pr = pronúncia, tip),
   frases (es, pt, why = explicação do erro comum) e diálogo de leitura.
   Ordem pensada pra quem tá no começo: nada aparece em exercício sem ter sido ensinado antes. */
const UNITS = [
{ id:"u1", title:"Oi e tchau", desc:"Cumprimentar e responder",
  intro:`<h3>Unidade 1 — Oi e tchau</h3>Tu vai aprender a cumprimentar alguém e responder "tudo bem".<ul>
  <li>O <b>h</b> no espanhol é mudo: <b>hola</b> se fala "óla".</li>
  <li>No Paraguai, no informal, usam <b>vos</b> no lugar de "tu". "¿Y vos?" = "E tu?"</li>
  <li>Pergunta tem <b>¿</b> no começo e ? no fim. Não precisa decorar: só reconhecer.</li></ul>`,
  learn:[
    {es:"hola", pt:"oi / olá", pr:"óla", tip:"O H é sempre mudo."},
    {es:"buenos días", pt:"bom dia", pr:"buênos días"},
    {es:"buenas tardes", pt:"boa tarde", pr:"buênas tárdes"},
    {es:"buenas noches", pt:"boa noite", pr:"buênas nótches", tip:"CH = \"tch\", igual tchau."},
    {es:"¿cómo estás?", pt:"como tu tá?", pr:"cômo estás"},
    {es:"bien", pt:"bem", pr:"biên"},
    {es:"más o menos", pt:"mais ou menos", pr:"más o mênos"},
    {es:"¿y vos?", pt:"e tu?", pr:"i vós", tip:"Paraguai e Argentina usam VOS no lugar de TÚ. Os dois tão certos."},
    {es:"gracias", pt:"obrigado", pr:"grácias"},
    {es:"chau", pt:"tchau", pr:"tcháu"},
    {es:"hasta mañana", pt:"até amanhã", pr:"ásta manhána", tip:"Ñ = NH. Hasta: H mudo de novo."},
  ],
  frases:[
    {es:"Hola, ¿cómo estás?", pt:"Oi, como tu tá?"},
    {es:"Bien, gracias.", pt:"Bem, obrigado."},
    {es:"Más o menos, ¿y vos?", pt:"Mais ou menos, e tu?"},
    {es:"Buenos días.", pt:"Bom dia."},
    {es:"Buenas noches, chau.", pt:"Boa noite, tchau."},
    {es:"Hasta mañana.", pt:"Até amanhã.", why:"Mañana se escreve com Ñ (nh) só no segundo N."},
  ],
  dialogo:{linhas:[["A","Hola, buenos días."],["B","Hola. ¿Cómo estás?"],["A","Bien, gracias. ¿Y vos?"],["B","Más o menos."]],
    perg:"Como a pessoa B tá?", certo:"Mais ou menos", erradas:["Bem","Cansada"]}
},
{ id:"u2", title:"Me apresentar", desc:"Nome, de onde é, trabalho",
  intro:`<h3>Unidade 2 — Me apresentar</h3>Dizer teu nome, de onde tu é e com o que trabalha.<ul>
  <li><b>Regra de ouro:</b> em espanhol o "yo" (eu) quase sempre <b>some</b>. O verbo já diz quem é: <b>Soy de Brasil</b>, não "Yo soy de Brasil".</li>
  <li><b>LL</b> no Paraguai soa parecido com "j" ou "dj": <b>me llamo</b> ≈ "me jámo".</li>
  <li><b>Vivir</b> = morar. "Vivo en Brasil" = moro no Brasil.</li></ul>`,
  learn:[
    {es:"me llamo", pt:"me chamo", pr:"me jámo", tip:"LL soa como \"j\" no Paraguai."},
    {es:"¿cómo te llamás?", pt:"como tu te chama?", pr:"cômo te jamás", tip:"Com VOS o acento cai no fim: llamás."},
    {es:"mucho gusto", pt:"prazer (em conhecer)", pr:"mútcho gústo"},
    {es:"soy", pt:"eu sou", pr:"sói", tip:"Sem \"yo\": SOY já quer dizer \"eu sou\"."},
    {es:"soy de Brasil", pt:"sou do Brasil", pr:"sói de brasíl"},
    {es:"brasileño", pt:"brasileiro", pr:"brasilênho"},
    {es:"vivo en", pt:"moro em", pr:"bívo en", tip:"V e B soam quase igual: \"bívo\"."},
    {es:"trabajo", pt:"(eu) trabalho", pr:"trabárro", tip:"J = R forte, de garganta (igual \"rato\")."},
    {es:"repartidor", pt:"entregador", pr:"rrepartidór"},
  ],
  frases:[
    {es:"Me llamo Pedro.", pt:"Me chamo Pedro."},
    {es:"¿Cómo te llamás?", pt:"Como tu te chama?"},
    {es:"Mucho gusto.", pt:"Prazer."},
    {es:"Soy de Brasil.", pt:"Sou do Brasil.", why:"Não precisa do \"yo\": SOY já é \"eu sou\"."},
    {es:"Soy brasileño.", pt:"Sou brasileiro."},
    {es:"Vivo en Brasil.", pt:"Moro no Brasil.", why:"Morar = VIVIR. \"Vivo en...\""},
    {es:"Trabajo de repartidor.", pt:"Trabalho de entregador.", why:"TRABAJO com J. E sem o \"yo\" na frente."},
  ],
  dialogo:{linhas:[["A","Hola. ¿Cómo te llamás?"],["B","Me llamo Lucas. ¿Y vos?"],["A","Me llamo Pedro. Mucho gusto."],["B","Mucho gusto. ¿Sos de Paraguay?"],["A","No, soy de Brasil."]],
    perg:"De onde o Pedro é?", certo:"Do Brasil", erradas:["Do Paraguai","Da Argentina"]}
},
{ id:"u3", title:"Números e dinheiro", desc:"Contar e perguntar preço",
  intro:`<h3>Unidade 3 — Números e dinheiro</h3>Os números de 1 a 10, cem e mil, e como perguntar preço.<ul>
  <li>No Paraguai o dinheiro é o <b>guaraní</b>. Os preços são em milhares: "diez mil" (10.000).</li>
  <li><b>Plata</b> = dinheiro no dia a dia (dinero também serve).</li>
  <li><b>Caro</b> e <b>barato</b> são iguais ao português. 😎</li></ul>`,
  learn:[
    {es:"uno", pt:"um", pr:"úno"},{es:"dos", pt:"dois", pr:"dós"},{es:"tres", pt:"três", pr:"trés"},
    {es:"cuatro", pt:"quatro", pr:"kuátro"},{es:"cinco", pt:"cinco", pr:"sínko"},{es:"seis", pt:"seis", pr:"séis"},
    {es:"siete", pt:"sete", pr:"siête"},{es:"ocho", pt:"oito", pr:"ótcho"},{es:"nueve", pt:"nove", pr:"nuêbe"},
    {es:"diez", pt:"dez", pr:"diês"},{es:"cien", pt:"cem", pr:"siên"},{es:"mil", pt:"mil", pr:"mil"},
    {es:"¿cuánto cuesta?", pt:"quanto custa?", pr:"kuánto kuêsta"},
    {es:"la plata", pt:"o dinheiro", pr:"la pláta", tip:"Plata é prata, mas no dia a dia quer dizer dinheiro."},
    {es:"caro", pt:"caro", pr:"káro"},{es:"barato", pt:"barato", pr:"baráto"},
  ],
  frases:[
    {es:"¿Cuánto cuesta?", pt:"Quanto custa?", why:"CUESTA, com UE (custa)."},
    {es:"Cuesta diez mil.", pt:"Custa dez mil."},
    {es:"Es muy caro.", pt:"É muito caro.", why:"Muito = MUY (antes de adjetivo)."},
    {es:"Es barato.", pt:"É barato."},
    {es:"No tengo plata.", pt:"Não tenho dinheiro."},
    {es:"Dos aguas, por favor.", pt:"Duas águas, por favor."},
  ],
  dialogo:{linhas:[["A","Hola. ¿Cuánto cuesta?"],["B","Cuesta cien mil."],["A","Es muy caro."],["B","¿Ochenta mil?"],["A","Bueno, gracias."]],
    perg:"O que o cliente achou do primeiro preço?", certo:"Muito caro", erradas:["Barato","Bom"]}
},
{ id:"u4", title:"Comida", desc:"Fome, pedir e pagar",
  intro:`<h3>Unidade 4 — Comida</h3>Dizer que tá com fome e pedir no restaurante.<ul>
  <li>Fome, sede, sono e frio usam <b>tener</b> (ter): <b>tengo hambre</b> = "tenho fome". Nunca "estoy con hambre".</li>
  <li><b>Exquisito</b> é falso amigo: quer dizer <b>delicioso</b>, não "esquisito".</li>
  <li><b>Para llevar</b> = pra viagem / pra levar.</li></ul>`,
  learn:[
    {es:"tengo hambre", pt:"tô com fome", pr:"têngo ámbre", tip:"Fome com TENER. H mudo: \"ámbre\"."},
    {es:"tengo sed", pt:"tô com sede", pr:"têngo séd"},
    {es:"quiero", pt:"eu quero", pr:"kiêro"},
    {es:"el agua", pt:"a água", pr:"él água"},
    {es:"el pollo", pt:"o frango", pr:"él pójo", tip:"Falso amigo: pollo é FRANGO. Polvo é \"pó\"."},
    {es:"el arroz", pt:"o arroz", pr:"él arrós"},
    {es:"el pan", pt:"o pão", pr:"él pán"},
    {es:"la cuenta", pt:"a conta", pr:"la kuênta"},
    {es:"para llevar", pt:"pra viagem", pr:"pára jebár"},
    {es:"exquisito", pt:"delicioso", pr:"eskisíto", tip:"Falso amigo! Exquisito = delicioso."},
  ],
  frases:[
    {es:"Tengo hambre.", pt:"Tô com fome.", why:"Fome usa TENER: tengo hambre (não \"estoy con hambre\")."},
    {es:"Tengo sed.", pt:"Tô com sede."},
    {es:"Quiero pollo con arroz.", pt:"Quero frango com arroz.", why:"Com = CON."},
    {es:"Un agua, por favor.", pt:"Uma água, por favor."},
    {es:"La cuenta, por favor.", pt:"A conta, por favor."},
    {es:"Para llevar, por favor.", pt:"Pra viagem, por favor."},
    {es:"Está exquisito.", pt:"Tá delicioso."},
  ],
  dialogo:{linhas:[["A","Hola. Tengo hambre. ¿Qué hay?"],["B","Hay pollo con arroz."],["A","Quiero pollo con arroz, para llevar."],["B","Bueno. Son veinte mil."]],
    perg:"O cliente vai comer lá?", certo:"Não, é pra viagem", erradas:["Sim, na mesa","Não pediu nada"]}
},
{ id:"u5", title:"Planos: voy a…", desc:"Hoje, amanhã e o que vai fazer",
  intro:`<h3>Unidade 5 — Planos: voy a…</h3>Falar do que tu vai fazer.<ul>
  <li>"Eu vou trabalhar" = <b>voy a trabajar</b>. O <b>a</b> entre "voy" e o verbo <b>nunca some</b>.</li>
  <li>Veículo usa <b>en</b>: <b>en moto</b>, en auto, en colectivo (ônibus no Paraguai). Nunca "de moto".</li>
  <li>Depois de <b>si</b> (se), o verbo vai conjugado: <b>si llueve</b> (se chover).</li></ul>`,
  learn:[
    {es:"voy a…", pt:"eu vou… (+ verbo)", pr:"bói a", tip:"Voy A trabajar, voy A comer. O A é obrigatório."},
    {es:"hoy", pt:"hoje", pr:"ói", tip:"H mudo: \"ói\"."},
    {es:"mañana", pt:"amanhã", pr:"manhána", tip:"Só o segundo N tem til: maÑana."},
    {es:"trabajar", pt:"trabalhar", pr:"trabarrár"},
    {es:"comer", pt:"comer", pr:"komér"},
    {es:"dormir", pt:"dormir", pr:"dormír"},
    {es:"hablar", pt:"falar", pr:"ablár", tip:"H mudo. Hablar = falar."},
    {es:"en moto", pt:"de moto", pr:"en móto", tip:"Veículo = EN. En moto, en auto."},
    {es:"el colectivo", pt:"o ônibus", pr:"él kolektíbo"},
    {es:"si llueve", pt:"se chover", pr:"si juêbe", tip:"SI sem acento = se. SÍ com acento = sim."},
  ],
  frases:[
    {es:"Hoy voy a trabajar.", pt:"Hoje vou trabalhar.", why:"VOY A + verbo. O A não pode faltar."},
    {es:"Mañana voy a dormir mucho.", pt:"Amanhã vou dormir muito."},
    {es:"Voy en moto.", pt:"Vou de moto.", why:"Veículo usa EN: en moto."},
    {es:"Voy a trabajar en moto.", pt:"Vou trabalhar de moto.", why:"VOY A trabajar + EN moto."},
    {es:"Mañana voy a hablar con mi papá.", pt:"Amanhã vou falar com meu pai.", why:"VOY A hablar. Papá com acento (papa = batata)."},
    {es:"Si llueve, no voy a trabajar.", pt:"Se chover, não vou trabalhar.", why:"Depois de SI vem LLUEVE (conjugado), não llover."},
    {es:"Hoy voy en colectivo.", pt:"Hoje vou de ônibus."},
  ],
  dialogo:{linhas:[["A","¿Qué vas a hacer mañana?"],["B","Mañana voy a trabajar en moto."],["A","¿Y si llueve?"],["B","Si llueve, voy a dormir. 😄"]],
    perg:"O que a pessoa B faz se chover?", certo:"Vai dormir", erradas:["Vai trabalhar de moto","Vai de ônibus"]}
},
{ id:"u6", title:"Na entrega", desc:"Pacote, endereço, vizinho",
  intro:`<h3>Unidade 6 — Na entrega</h3>O básico pra trabalhar de entregador.<ul>
  <li><b>Dirección</b> = <b>endereço</b> (falso amigo!).</li>
  <li><b>Paquete</b> se escreve com <b>QU</b> (som de K).</li>
  <li><b>Derecha</b> = direita, <b>izquierda</b> = esquerda.</li></ul>`,
  learn:[
    {es:"el paquete", pt:"o pacote", pr:"él pakête", tip:"Som de K antes de E/I se escreve QU."},
    {es:"entrego", pt:"eu entrego", pr:"entrêgo"},
    {es:"la dirección", pt:"o endereço", pr:"la direksión", tip:"Falso amigo! Dirección = endereço."},
    {es:"la calle", pt:"a rua", pr:"la káje"},
    {es:"el vecino", pt:"o vizinho", pr:"él besíno"},

const U0=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];

function numEs(n){
  if(n<30) return U0[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;return T0[t]+(u?" y "+U0[u]:"");}
  if(n<1000){if(n===100)return "cien";const h=Math.floor(n/100),r=n%100;return H0[h]+(r?" "+numEs(r):"");}
  if(n<1000000){const m=Math.floor(n/1000),r=n%1000;const pre=m===1?"":numEs(m).replace(/uno$/,"un")+" ";return pre+"mil"+(r?" "+numEs(r):"");}

}

function osa(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[m][n];}
let VOCAB=null;
function vocab(){if(!VOCAB){VOCAB=new Set();UNITS.forEach(u=>{u.learn.concat(u.frases).forEach(x=>words(x.es).forEach(w=>VOCAB.add(noAcc(w.toLowerCase()))));});}return VOCAB;}
function typos(typed,target){ // devolve lista de [digitou, certo] se só tiver errinho de digitação; senão null
  const A=words(typed.toLowerCase()),B=words(target.toLowerCase()); if(A.length!==B.length) return null;
  const out=[];
  for(let i=0;i<A.length;i++){const a=noAcc(A[i]),b=noAcc(B[i]); if(a===b) continue;
    if(b.length<4||osa(a,b)>1) return null;               // palavra curta ou erro grande: conta
    if(vocab().has(a)) return null;                         // virou outra palavra de verdade (está/estás)
    if(a.slice(0,-1)===b.slice(0,-1)&&/[oa]$/.test(a)&&/[oa]$/.test(b)) return null; // masculino/feminino
    if(a+"s"===b||b+"s"===a) return null;                   // singular/plural, tú/vos
    out.push([A[i],B[i]]);}
  return out.length&&out.length<=2?out:null;
}
function sim(a,b){a=noAcc(clean(a));b=noAcc(clean(b));const m=a.length,n=b.length;if(!m||!n)return 0;
  const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1-d[m][n]/Math.max(m,n);}

  const errs=Object.values(S.errors).sort((a,b)=>b.n-a.n).slice(0,10).map(e=>`${e.es} (${e.n}x)`);
  const last=S.hist.slice(-6).map(h=>`${h.d} ${h.u} n${h.l} ${h.acc}%`);
  return `PROGRESSO ESPANHOL ${today()}\nXP ${S.xp} · sequência ${S.streak} dias\nNíveis feitos: ${done}\nDomina (${dom.length}): ${dom.join(" | ")||"-"}\nFirmando (${mid.length}): ${mid.join(" | ")||"-"}\nAinda fraco (${low.length}): ${low.join(" | ")||"-"}\nMais errados: ${errs.join(" | ")||"-"}\nÚltimas lições: ${last.join(" ; ")||"-"}`;
}

function grade(ok,correct,why,errItem){
  L.graded++;

  const e=L.ex[L.i];
  if(!ok){
    L.mist++; L.hearts--;
    if(errItem){const k=errItem.es; const prev=S.errors[k]; S.errors[k]={es:k,kind:errItem.kind,u:errItem.u,n:(prev?prev.n:0)+1};}
    // repete o exercício no fim da lição (uma vez)
    if(!e._re){L.ex.push(Object.assign({},e,{_re:true}));}
  } else if(errItem&&S.errors[errItem.es]&&L.ui===-1){ // acertou na revisão: diminui
    const r=S.errors[errItem.es]; r.n--; if(r.n<=0) delete S.errors[errItem.es];
  }
  L.combo=ok?(L.combo||0)+1:0;
  if(ok) SFX.ok(); else { SFX.bad(); const bd=$("#body"); if(bd){bd.classList.remove("shake");void bd.offsetWidth;bd.classList.add("shake");}
    const h=document.querySelector(".hearts"); if(h){h.textContent="❤ "+L.hearts;h.classList.add("hit");} }
  const f=$("#foot"); f.className="foot "+(ok?"ok":"bad");

  const combo=ok&&L.combo>=3?`<span class="combo">🔥 ${L.combo} seguidas!</span>`:"";
  f.innerHTML=`<div class="fb"><strong>${ok?praise[Math.random()*praise.length|0]:"Quase…"}${combo}</strong>
    ${ok?(correct?`<span>${esc(correct)}</span>`:""):`Resposta certa: <b>${esc(correct)}</b>`}
    ${why?`<div class="why">💡 ${esc(why)}</div>`:""}</div>
    <button class="go" id="chk">CONTINUAR</button>`;
  $("#chk").onclick=()=>{ if(L.hearts<=0){outOfHearts();return;} next(); };
  document.querySelectorAll("#body button:not([data-say])").forEach(b=>b.disabled=true);
  const st=e.it?e.it.es:(e.f?e.f.es:null); if(ok&&st&&!e.noSay) sayLater(st,380);
}

    $("#foot").innerHTML=`<div class="fb" style="font-size:15px">🔁 Treino: escuta e repete em voz alta 2x junto com o áudio. (Aqui não dá pra conferir.)</div><button class="go" id="chk">CONTINUAR</button>`;

  let tries=0, rec=null, best=null;
  const mark=heard=>{ // pinta cada palavra: verde = falou, vermelho = faltou

      };
      rec.start();
    }catch(err){ MIC="blocked"; rec=null; treino("🎙️ O microfone não liberou nesta página."); }
  };
  $("#foot").className="foot";

function finish(){
  const xp=10+Math.max(0,L.graded-L.mist);
  S.xp+=xp; S._prevStreak=S.streak;
  const t=today();
  if(S.lastDay!==t){ const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    S.streak=(S.lastDay===ys)?S.streak+1:1; S.lastDay=t; }
  if(L.ui>=0){ const id=L.unit.id; S.done[id]=S.done[id]||[]; if(!S.done[id].includes(L.level)) S.done[id].push(L.level); }
  const acc=L.graded?Math.round((L.graded-L.mist)/L.graded*100):100;
  var streakUp=S._prevStreak!==undefined&&S.streak>S._prevStreak;
  S.hist.push({d:t,u:L.ui>=0?L.unit.id:"rev",l:L.level,acc,err:L.mist}); if(S.hist.length>200) S.hist=S.hist.slice(-200);
  save();
  delete S._prevStreak;
  let nx=null; if(L.ui>=0){ nx=L.level<3?[L.ui,L.level+1]:(L.ui+1<UNITS.length?[L.ui+1,1]:null); }
  const nxName=nx?(nx[1]===1?`Unidade ${nx[0]+1}: ${UNITS[nx[0]].title}`:["","Aprender","Frases","Desafio"][nx[1]]):"";
  $("#app").innerHTML=`<div class="end"><div class="big">${acc===100?"🏆":"🎉"}</div><h1>${acc===100?"Lição perfeita!":"Lição completa!"}</h1>
    <div class="stats"><div>+<span id="xpc">0</span><small>XP</small></div><div>${acc}%<small>acertos</small></div><div>🔥 ${S.streak}<small>${streakUp?"dias · +1!":"dias"}</small></div></div>
    <p class="sub">${acc>=90?"Mandou muito.":acc>=70?"Bom! O que errou vai aparecer na revisão.":"Tá aprendendo, é isso mesmo. Faz a revisão depois."}</p>
    ${nx?`<button class="go" id="nxt">PRÓXIMA: ${esc(nxName).toUpperCase()}</button><p></p><button class="go ghost" id="back">VOLTAR PRA TRILHA</button>`:`<button class="go" id="back">CONTINUAR</button>`}</div>`;
  $("#back").onclick=home; if(nx) $("#nxt").onclick=()=>start(nx[0],nx[1]);
  SFX.done(); confetti();
  let k=0; const xi=setInterval(()=>{k=Math.min(xp,k+Math.ceil(xp/15)); const el=$("#xpc"); if(el)el.textContent=k; if(k>=xp)clearInterval(xi);},40);
}
home();
if("serviceWorker" in navigator && location.protocol==="https:" && !location.hostname.endsWith("claude.ai")){try{navigator.serviceWorker.register("sw.js").then(r=>{try{r.update();}catch(e){}}).catch(()=>{}); navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!window._rl){window._rl=1;location.reload();}});}catch(e){}}
</script>
